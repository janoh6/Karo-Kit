name: Release

# Fires when a version tag (vX.Y.Z) is pushed, and creates a GitHub Release
# for it with notes pulled from the matching "= X.Y.Z =" section of
# README.md's changelog.
#
# GitHub only looks for this file in the commit tree of the ref that
# triggered the push — a tag pointing at a commit from before this workflow
# existed won't fire it. Use workflow_dispatch with that tag name to publish
# a release for one of those retroactively.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Extract changelog section
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 == "= " ver " =" { found=1; next }
            found && /^= [0-9]/ { exit }
            found { print }
          ' README.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog section found for $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag
