name: Release

# Fires when a version tag (vX.Y.Z) is pushed, and creates a GitHub Release
# for it with notes pulled from the matching "= X.Y.Z =" section of
# README.md's changelog.
#
# GitHub only looks for this file in the commit tree of the ref that
# triggered the push — a tag pointing at a commit from before this workflow
# existed won't fire it. Use workflow_dispatch with that tag name to publish
# a release for one of those retroactively.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Extract changelog section
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 == "= " ver " =" { found=1; next }
            found && /^= [0-9]/ { exit }
            found { print }
          ' README.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog section found for $version" >&2
            exit 1
          fi

      # GitHub's own auto-generated "Source code" archive unpacks to a folder
      # named after the repo (Karo-Kit-x.y.z), not karo-kit — so installing it
      # in WordPress creates a second, unrelated-looking plugin instead of
      # updating the existing one, and it still carries this dev doc and the
      # CI config. Building the zip explicitly, rooted at karo-kit/ and
      # containing only what actually ships, fixes both: a manual
      # download-and-upload round-trip now offers to replace the existing
      # install, and it's what the in-admin update checker (see
      # includes/class-karo-kit-updates.php) fetches instead of the source
      # archive.
      - name: Build plugin zip
        run: |
          mkdir -p build/karo-kit
          cp -r assets includes languages modules build/karo-kit/
          cp index.php karo-kit.php uninstall.php README.md build/karo-kit/
          ( cd build && zip -rq ../karo-kit.zip karo-kit )

      - name: Create release
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            karo-kit.zip
